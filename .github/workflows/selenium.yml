
name: Selenium Maven Docker Hub CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Maven Tests
        run: mvn clean test

  docker-build-push:
    runs-on: ubuntu-latest
    needs: selenium-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/par2:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/par2:${{ github.sha }} \
            .

      - name: Push Latest Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/par2:latest

      - name: Push GitHub SHA Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/par2:${{ github.sha }}
